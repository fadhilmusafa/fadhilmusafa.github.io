<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halaman Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f4f7fa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: 'Arial', sans-serif;
    }

    .login-container {
      background-color: white;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 450px;
      transition: transform 0.3s ease;
    }

    .login-container:hover {
      transform: scale(1.02);
    }

    .form-control {
      border-radius: 5px;
    }

    .notification {
      display: none;
      margin-top: 20px;
      padding: 12px;
      border-radius: 5px;
    }

    .notification.success {
      background-color: #28a745;
      color: white;
    }

    .notification.error {
      background-color: #dc3545;
      color: white;
    }

    h3 {
      font-size: 24px;
      color: #343a40;
      text-align: center;
    }

    .text-center {
      text-align: center;
    }

    .btn-primary {
      background-color: #007bff;
      border-color: #007bff;
      transition: background-color 0.3s;
    }

    .btn-primary:hover {
      background-color: #0056b3;
      border-color: #0056b3;
    }

    .login-container .form-label {
      color: #495057;
      font-weight: 600;
    }

    .login-container .btn-secondary {
      background-color: #6c757d;
      border-color: #6c757d;
      color: white;
    }

    .login-container .btn-secondary:hover {
      background-color: #5a6268;
      border-color: #545b62;
    }

    .forgot-password {
      color: #007bff;
      font-size: 14px;
    }

    .forgot-password:hover {
      text-decoration: underline;
    }

    .text-center p {
      font-size: 14px;
    }

  </style>
</head>
<body>

<div class="login-container">
  <h3>Login Admin</h3>

  <!-- Notification -->
  <div id="notification" class="notification"></div>

  <form id="loginForm">
    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input type="email" id="email" class="form-control" required placeholder="Masukkan email">
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input type="password" id="password" class="form-control" required placeholder="Masukkan password">
    </div>
    <button type="submit" class="btn btn-primary w-100">Login</button>
  </form>

  <div class="text-center mt-3">
    <a href="#" class="forgot-password">Lupa password?</a>
  </div>

  <div class="text-center mt-3">
    <p>Belum punya akun? <a href="#">Daftar sekarang</a></p>
  </div>
</div>

<script>
  alert("test")
  // Simulasi data login (dapat diganti dengan API atau autentikasi nyata)
  const adminCredentials = {
    email: "admin@gmail.com",
    password: "admin"
  };

  // Fungsi untuk menampilkan notifikasi
  function showNotification(type, message) {
    const notification = document.getElementById('notification');
    notification.classList.add(type === 'success' ? 'success' : 'error');
    notification.innerHTML = message;
    notification.style.display = 'block';
    setTimeout(() => {
      notification.style.display = 'none';
      notification.classList.remove(type === 'success' ? 'success' : 'error');
    }, 3000);
  }

  // Menangani pengiriman form login
  document.getElementById('loginForm').addEventListener('submit', function(event) {
    event.preventDefault();

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    // Validasi email dan password
    if (email === adminCredentials.email && password === adminCredentials.password) {
      showNotification('success', 'Login berhasil!');
      // Alihkan ke halaman dashboard setelah login sukses
      setTimeout(() => {
        window.location.href = "dasboard.html";  // Ganti dengan URL halaman dashboard Anda
      }, 2000);
    } else {
      showNotification('error', 'Email atau password salah.');
    }
  });
</script>

</body>
</html>
